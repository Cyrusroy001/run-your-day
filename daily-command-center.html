<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reminders 2 — Live Execution Engine</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700;900&family=Spline+Sans:wght@400;500;600;700&display=swap");

      :root {
        --bg: #0e1311;
        --bg2: #141b18;
        --panel: #19211d;
        --panel2: #1f2925;
        --cream: #f2ede1;
        --terra: #d9663d;
        --moss: #8fb05a;
        --amber: #e0a23a;
        --sky: #6fa8c7;
        --line: #2c3833;
        --muted: #8a978f;
        --dim: #5e6c64;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Spline Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--cream);
        padding: 20px 15px;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.5;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 25px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 15px;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: 2rem;
        font-weight: 900;
        line-height: 1;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--moss);
      }

      .config-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 25px;
      }
      label {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      select,
      input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        color: var(--cream);
        font-family: inherit;
        font-size: 0.9rem;
      }

      .now-card {
        background: var(--panel);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--terra);
        margin-bottom: 30px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        position: relative;
      }
      .now-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .now-badge {
        background: rgba(217, 102, 61, 0.15);
        color: var(--terra);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        text-transform: uppercase;
      }
      .now-title {
        font-family: "Fraunces", serif;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 5px;
        color: var(--cream);
      }
      .now-desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 15px;
      }

      .metric-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        font-size: 0.85rem;
        font-weight: 500;
        background: var(--panel2);
        padding: 10px;
        border-radius: 8px;
      }
      .metric-val {
        color: var(--cream);
        font-variant-numeric: tabular-nums;
      }
      .metric-warn {
        color: var(--amber);
      }

      .btn-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 10px;
      }
      button {
        color: var(--cream);
        border: none;
        border-radius: 8px;
        padding: 14px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--terra);
      }
      .btn-secondary {
        background: var(--panel2);
        border: 1px solid var(--line);
      }

      .timeline-title {
        font-family: "Fraunces", serif;
        font-size: 1.2rem;
        margin-bottom: 15px;
      }
      .timeline-item {
        display: grid;
        grid-template-columns: 70px 16px 1fr;
        gap: 15px;
        margin-bottom: 5px;
        position: relative;
      }
      .timeline-item.dropped {
        opacity: 0.4;
      }

      .time-col {
        text-align: right;
        padding-top: 2px;
      }
      .time-est {
        font-size: 0.9rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .time-est.drifted {
        color: var(--amber);
      }
      .time-dur {
        font-size: 0.75rem;
        color: var(--dim);
        display: block;
      }

      .node-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      .node-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--line);
        margin-top: 6px;
        z-index: 2;
      }
      .node-dot.active {
        background: var(--terra);
        box-shadow: 0 0 12px var(--terra);
      }
      .node-dot.done {
        background: var(--moss);
      }
      .node-dot.mod {
        background: var(--sky);
      }
      .node-dot.killed {
        background: #e74c3c;
      }
      .node-line {
        width: 2px;
        background: var(--line);
        position: absolute;
        top: 18px;
        bottom: -4px;
        z-index: 1;
      }
      .timeline-item:last-child .node-line {
        display: none;
      }

      .content-col {
        padding-bottom: 20px;
      }
      .item-label {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .item-label.done {
        text-decoration: line-through;
        color: var(--dim);
      }
      .item-desc {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .pill {
        display: inline-block;
        padding: 2px 6px;
        font-size: 0.65rem;
        border-radius: 4px;
        font-weight: 700;
        margin-left: 6px;
        text-transform: uppercase;
      }
      .pill.comp {
        background: rgba(224, 162, 58, 0.15);
        color: var(--amber);
      }
      .pill.dropped {
        background: rgba(231, 76, 60, 0.15);
        color: #e74c3c;
      }

      /* Debug Panel */
      .debug-panel {
        margin-top: 40px;
        padding: 15px;
        border: 1px dashed var(--dim);
        border-radius: 8px;
      }
      .debug-panel h4 {
        color: var(--dim);
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Reminders 2</h1>
        <div style="color: var(--dim); font-size: 0.85rem; margin-top: 4px">
          Live Local Engine
        </div>
      </div>
      <div class="clock" id="sysClock">00:00</div>
    </header>

    <div class="config-row">
      <div>
        <label>Routine Blueprint</label>
        <select id="uiProfile" onchange="changeProfile()">
          <option value="wfh">WFH (Expanded Budget)</option>
          <option value="office">Office (Restricted Hours)</option>
          <option value="weekend">Weekend (Unstructured)</option>
        </select>
      </div>
      <div>
        <label>Day Start Anchor</label>
        <input type="time" id="uiWake" onchange="changeWakeTime()" />
      </div>
    </div>

    <div id="nowContainer" class="now-card" style="display: none">
      <div class="now-header">
        <span class="now-badge">Active Block</span>
      </div>
      <div class="now-title" id="nowTitle">Loading...</div>
      <div class="now-desc" id="nowDesc">...</div>

      <div class="metric-bar">
        <div>Time Budget: <span class="metric-val" id="nowDur">0m</span></div>
        <div>
          Drift Status: <span class="metric-val" id="nowDrift">On Track</span>
        </div>
      </div>

      <div class="btn-grid">
        <button class="btn-primary" onclick="markActive('done')">
          ✓ Commit Block
        </button>
        <button class="btn-secondary" onclick="markActive('mod')">
          Partial Mod
        </button>
      </div>
    </div>

    <div
      id="doneMessage"
      style="
        display: none;
        text-align: center;
        padding: 40px;
        background: var(--panel2);
        border-radius: 16px;
        margin-bottom: 30px;
        border: 1px solid var(--moss);
      "
    >
      <h2
        style="
          color: var(--moss);
          font-family: &quot;Fraunces&quot;;
          margin-bottom: 10px;
        "
      >
        Day Complete
      </h2>
      <p style="color: var(--muted); font-size: 0.9rem">
        Evening wind-down window is protected.
      </p>
    </div>

    <h2 class="timeline-title">Calculated Trajectory</h2>
    <div id="timelineContainer"></div>

    <div class="debug-panel">
      <h4>Developer Debug / Time Travel</h4>
      <div style="display: flex; gap: 10px">
        <button
          class="btn-secondary"
          style="padding: 8px; font-size: 0.8rem"
          onclick="addFakeMinutes(30)"
        >
          +30m Drift
        </button>
        <button
          class="btn-secondary"
          style="padding: 8px; font-size: 0.8rem"
          onclick="addFakeMinutes(60)"
        >
          +60m Drift
        </button>
        <button
          class="btn-secondary"
          style="
            padding: 8px;
            font-size: 0.8rem;
            background: #e74c3c;
            border: none;
          "
          onclick="hardResetDay()"
        >
          Reset Day
        </button>
      </div>
    </div>

    <script>
      // --- CORE DATA SCHEMA (The "Seed JSON") ---
      const planData = {
        office: {
          anchors: [{ id: "job", start: "14:00", end: "20:00" }], // Real world constraints
          blocks: [
            { id: "b1", label: "Wake & Hydrate", duration: 15, minDur: 15 },
            {
              id: "b2",
              label: "Deep Focus (SDE)",
              duration: 90,
              minDur: 45,
              maxDrift: 60,
              dropType: "scale_to_min",
              desc: "Highest cognitive workload.",
            },
            {
              id: "b3",
              label: "Train (Hypertrophy)",
              duration: 60,
              minDur: 40,
              maxDrift: 90,
              dropType: "kill_and_notify",
              desc: "Physical pacing window.",
            },
            { id: "b4", label: "Shower & Protein", duration: 45, minDur: 30 },
          ],
        },
        wfh: {
          anchors: [{ id: "job", start: "14:00", end: "20:00" }],
          blocks: [
            { id: "b1", label: "Wake & Sunlight", duration: 15, minDur: 15 },
            {
              id: "b2",
              label: "AI Build Immersion",
              duration: 120,
              minDur: 60,
              maxDrift: 90,
              dropType: "scale_to_min",
              desc: "No meetings. Total flow state.",
            },
            {
              id: "b3",
              label: "Midday Training",
              duration: 60,
              minDur: 45,
              maxDrift: 120,
              dropType: "kill_and_notify",
            },
            { id: "b4", label: "Nutrition & Prep", duration: 45, minDur: 30 },
          ],
        },
        weekend: {
          anchors: [],
          blocks: [
            { id: "b1", label: "Relaxed Wake", duration: 30, minDur: 15 },
            {
              id: "b2",
              label: "Creative R&D",
              duration: 150,
              minDur: 60,
              maxDrift: 180,
              dropType: "scale_to_min",
            },
            {
              id: "b3",
              label: "Long Physical Session",
              duration: 75,
              minDur: 45,
              maxDrift: 180,
              dropType: "kill_and_notify",
            },
          ],
        },
      };

      // --- STATE MANAGEMENT ---
      let sysState = {
        date: new Date().toLocaleDateString(),
        profile: "wfh",
        wakeAnchor: "08:00",
        history: {}, // { id: { status, endMins, durationUsed } }
        audioCache: {}, // Tracks which dropped blocks have already played sound
      };

      // Debug offset for time-travel
      let debugTimeOffsetMins = 0;

      function loadState() {
        const saved = localStorage.getItem("sdeEngineState");
        if (saved) {
          const parsed = JSON.parse(saved);
          // Auto-reset if it's a new calendar day
          if (parsed.date === new Date().toLocaleDateString()) {
            sysState = parsed;
          }
        }
        document.getElementById("uiProfile").value = sysState.profile;
        document.getElementById("uiWake").value = sysState.wakeAnchor;
      }

      function saveState() {
        localStorage.setItem("sdeEngineState", JSON.stringify(sysState));
      }

      // --- UTILITIES ---
      function getRealTimeMins() {
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes() + debugTimeOffsetMins;
      }

      function formatMins(mins) {
        const h = Math.floor(mins / 60) % 24;
        const m = Math.floor(mins % 60);
        return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}`;
      }

      function parseMins(timeStr) {
        const [h, m] = timeStr.split(":").map(Number);
        return h * 60 + m;
      }

      // --- AUDIO ALARM ENGINE ---
      function playDriftChime() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(349.23, ctx.currentTime + 0.15); // F4

          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {
          console.warn("Audio blocked by browser auto-play policy.");
        }
      }

      // --- CORE ENGINE LOGIC ---
      function runEngine() {
        const currentWallMins = getRealTimeMins();
        document.getElementById("sysClock").innerText =
          formatMins(currentWallMins);

        const plan = planData[sysState.profile];
        let cursorMins = parseMins(sysState.wakeAnchor);

        const tlContainer = document.getElementById("timelineContainer");
        tlContainer.innerHTML = "";

        let activeFound = false;
        let hasPending = false;
        let INTER_BLOCK_BUFFER = 10; // 10 minutes between blocks

        plan.blocks.forEach((block) => {
          let status = "pending";
          let blockStart = cursorMins;
          let computedDuration = block.duration;
          let calculatedDrift = 0;
          let isCompacted = false;

          // 1. Check if already processed in history
          if (sysState.history[block.id]) {
            const rec = sysState.history[block.id];
            status = rec.status;
            computedDuration = rec.durationUsed;
            // Tracing history forward: start was when they finished minus what they used
            blockStart = rec.endMins - rec.durationUsed;
            cursorMins = rec.endMins + INTER_BLOCK_BUFFER;
          }
          // 2. Unprocessed block (Pending or Active)
          else {
            hasPending = true;
            calculatedDrift = Math.max(0, currentWallMins - blockStart);

            // Evaluate Circuit Breakers (Max Drift)
            if (block.maxDrift && calculatedDrift > block.maxDrift) {
              if (block.dropType === "kill_and_notify") {
                status = "dropped";
                computedDuration = 0;

                // Auto-commit drop to persistent state
                sysState.history[block.id] = {
                  status: "dropped",
                  endMins: currentWallMins,
                  durationUsed: 0,
                };

                // Fire Audio Alarm once
                if (!sysState.audioCache[block.id]) {
                  playDriftChime();
                  sysState.audioCache[block.id] = true;
                }
                saveState();
              } else if (block.dropType === "scale_to_min") {
                computedDuration = block.minDur;
                isCompacted = true;
              }
            }

            // Evaluate Fixed Anchor Boundaries (Micro-Compaction)
            if (status !== "dropped") {
              plan.anchors.forEach((anc) => {
                const ancMins = parseMins(anc.start);
                if (blockStart + computedDuration > ancMins) {
                  computedDuration = Math.max(
                    block.minDur,
                    ancMins - blockStart,
                  );
                  isCompacted = true;
                  // If it's already past the anchor start, kill it.
                  if (blockStart >= ancMins) {
                    status = "dropped";
                    computedDuration = 0;
                    sysState.history[block.id] = {
                      status: "dropped",
                      endMins: currentWallMins,
                      durationUsed: 0,
                    };
                    saveState();
                  }
                }
              });
            }

            // Identify Active Task
            if (status !== "dropped" && !activeFound) {
              status = "active";
              activeFound = true;
              renderNowCard(block, computedDuration, calculatedDrift);
            }

            // Advance simulated cursor for next items
            if (status !== "dropped") {
              cursorMins = blockStart + computedDuration + INTER_BLOCK_BUFFER;
            }
          }

          // --- RENDER TIMELINE HTML ---
          const div = document.createElement("div");
          div.className = `timeline-item ${status === "dropped" ? "dropped" : ""}`;

          let timeClass =
            calculatedDrift > 0 &&
            status !== "dropped" &&
            status !== "done" &&
            status !== "mod"
              ? "time-est drifted"
              : "time-est";
          let dotClass = `node-dot ${status}`; // active, done, mod, dropped, pending

          div.innerHTML = `
      <div class="time-col">
        <span class="${timeClass}">${formatMins(blockStart)}</span>
        <span class="time-dur">${computedDuration}m</span>
      </div>
      <div class="node-col">
        <div class="${dotClass}"></div>
        <div class="node-line"></div>
      </div>
      <div class="content-col">
        <div class="item-label ${status === "done" || status === "mod" ? "done" : ""}">
          ${block.label}
          ${isCompacted && status !== "done" && status !== "mod" ? '<span class="pill comp">Scaled</span>' : ""}
          ${status === "dropped" ? '<span class="pill dropped">Dropped</span>' : ""}
        </div>
        <div class="item-desc">${block.desc || ""}</div>
      </div>
    `;
          tlContainer.appendChild(div);
        });

        // Handle "All Done" State
        if (!activeFound && !hasPending) {
          document.getElementById("nowContainer").style.display = "none";
          document.getElementById("doneMessage").style.display = "block";
        } else {
          document.getElementById("doneMessage").style.display = "none";
        }
      }

      function renderNowCard(block, duration, drift) {
        document.getElementById("nowContainer").style.display = "block";
        document.getElementById("nowTitle").innerText = block.label;
        document.getElementById("nowDesc").innerText =
          block.desc || "Execute parameters.";
        document.getElementById("nowDur").innerText = `${duration}m`;

        const driftEl = document.getElementById("nowDrift");
        if (drift > 0) {
          driftEl.innerText = `Delayed by ${drift}m`;
          driftEl.className = "metric-val metric-warn";
        } else {
          driftEl.innerText = `Optimal Pace`;
          driftEl.className = "metric-val";
          driftEl.style.color = "var(--moss)";
        }

        // Store active info in global context for buttons
        window.currentActiveBlock = { id: block.id, duration: duration };
      }

      // --- USER ACTIONS ---
      function markActive(statusType) {
        // 'done' or 'mod'
        if (!window.currentActiveBlock) return;
        const currentWallMins = getRealTimeMins();

        sysState.history[window.currentActiveBlock.id] = {
          status: statusType,
          endMins: currentWallMins, // Time it was actually clicked
          durationUsed: window.currentActiveBlock.duration,
        };

        saveState();
        runEngine();
      }

      function changeProfile() {
        sysState.profile = document.getElementById("uiProfile").value;
        runEngine(); // recalculate immediately without saving state wipes, just re-renders structure
        saveState();
      }

      function changeWakeTime() {
        sysState.wakeAnchor = document.getElementById("uiWake").value;
        saveState();
        runEngine();
      }

      function addFakeMinutes(mins) {
        debugTimeOffsetMins += mins;
        runEngine();
      }

      function hardResetDay() {
        sysState = {
          date: new Date().toLocaleDateString(),
          profile: sysState.profile,
          wakeAnchor: sysState.wakeAnchor,
          history: {},
          audioCache: {},
        };
        debugTimeOffsetMins = 0;
        saveState();
        runEngine();
      }

      // --- BOOT SEQUENCE ---
      loadState();
      runEngine();

      // Tick the engine every 10 seconds to auto-calculate real-time drift
      setInterval(runEngine, 10000);
    </script>
  </body>
</html>
